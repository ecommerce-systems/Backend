<svg width="720" height="340" viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="720" height="340" fill="#fcfcfb"/>

  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#0b0b0b">V1 → V2, 아키텍처만 바꿔서 얻은 평균 응답속도 개선</text>
  <text x="360" y="48" text-anchor="middle" font-size="12" fill="#52514e">k6 부하 테스트 실측치 (docs/Performance/), 단위: 배(x)</text>

  <!-- gridlines -->
  <line x1="190" y1="60" x2="190" y2="300" stroke="#c3c2b7" stroke-width="1"/>
  <line x1="292.2" y1="60" x2="292.2" y2="300" stroke="#e1e0d9" stroke-width="1"/>
  <line x1="394.4" y1="60" x2="394.4" y2="300" stroke="#e1e0d9" stroke-width="1"/>
  <line x1="496.7" y1="60" x2="496.7" y2="300" stroke="#e1e0d9" stroke-width="1"/>
  <line x1="598.9" y1="60" x2="598.9" y2="300" stroke="#e1e0d9" stroke-width="1"/>
  <line x1="190" y1="300" x2="650" y2="300" stroke="#c3c2b7" stroke-width="1"/>

  <!-- axis ticks -->
  <text x="190" y="316" text-anchor="middle" font-size="11" fill="#898781">0</text>
  <text x="292.2" y="316" text-anchor="middle" font-size="11" fill="#898781">2배</text>
  <text x="394.4" y="316" text-anchor="middle" font-size="11" fill="#898781">4배</text>
  <text x="496.7" y="316" text-anchor="middle" font-size="11" fill="#898781">6배</text>
  <text x="598.9" y="316" text-anchor="middle" font-size="11" fill="#898781">8배</text>

  <!-- bar 1: 인증 3.2x, band center y=90 -->
  <text x="180" y="95" text-anchor="end" font-size="13" fill="#0b0b0b">인증 (Redis)</text>
  <path d="M 190,79 L 349.6,79 A 4,4 0 0 1 353.6,83 L 353.6,97 A 4,4 0 0 1 349.6,101 L 190,101 Z" fill="#2a78d6"/>
  <text x="361.6" y="95" font-size="13" font-weight="600" fill="#0b0b0b">3.2배</text>

  <!-- bar 2: 상품 검색 8.0x, band center y=150 -->
  <text x="180" y="155" text-anchor="end" font-size="13" fill="#0b0b0b">상품 검색</text>
  <path d="M 190,139 L 594.9,139 A 4,4 0 0 1 598.9,143 L 598.9,157 A 4,4 0 0 1 594.9,161 L 190,161 Z" fill="#2a78d6"/>
  <text x="606.9" y="155" font-size="13" font-weight="600" fill="#0b0b0b">8.0배</text>

  <!-- bar 3: 공동구매 1.2x, band center y=210 -->
  <text x="180" y="215" text-anchor="end" font-size="13" fill="#0b0b0b">공동구매 추천</text>
  <path d="M 190,199 L 247.3,199 A 4,4 0 0 1 251.3,203 L 251.3,217 A 4,4 0 0 1 247.3,221 L 190,221 Z" fill="#2a78d6"/>
  <text x="259.3" y="215" font-size="13" font-weight="600" fill="#0b0b0b">1.2배</text>

  <!-- bar 4: 인스턴스 확장 1.2x, band center y=270 -->
  <text x="180" y="275" text-anchor="end" font-size="13" fill="#0b0b0b">인스턴스 확장</text>
  <path d="M 190,259 L 247.3,259 A 4,4 0 0 1 251.3,263 L 251.3,277 A 4,4 0 0 1 247.3,281 L 190,281 Z" fill="#2a78d6"/>
  <text x="259.3" y="275" font-size="13" font-weight="600" fill="#0b0b0b">1.2배</text>
</svg>
